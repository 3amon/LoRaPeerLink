name: CI Build and Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake g++ catch2 python3 python3-pip
        pip3 install cryptography

    - name: Configure and Build
      run: |
        cmake -S . -B build
        cmake --build build -j

    - name: Run C++ Tests
      run: ./build/tests/test_all

    - name: Run seed sweeps (simulated radio, 200 seeds per scenario)
      run: ./build/tests/test_all "[.stress]"

    - name: Library builds with embedded-style flags
      run: |
        for f in src/*.cpp; do
          g++ -std=c++11 -fno-exceptions -fno-rtti -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror -I include -c "$f" -o /dev/null
        done

    - name: Run C++ Tests under AddressSanitizer and UBSan
      run: |
        cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
        cmake --build build-asan -j
        ./build-asan/tests/test_all

    - name: Run Python-C++ Cross-Validation Tests
      run: python3 validate_encryption.py

    - name: Export PlatformIO Library
      if: success()
      run: ./export_library.sh

    - name: Upload Library Export
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LoRaPeerLink-PlatformIO-Library
        path: LoRaPeerLink-Export/
        retention-days: 90
