; LoRaPeerLink hardware bench test
;
; Flash the same firmware to two or more boards and watch the serial output.
; See README.md in this directory.
;
;   pio run -e t3_scanner -t upload --upload-port /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0
;
; The radio driver (SemtechRadio) and the vendor radio stack are shared with
; the esp32_platformio example next door; the library itself is taken from
; this checkout, not from GitHub.

[platformio]
default_envs = t3_scanner

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
	symlink://../../
	symlink://../esp32_platformio/lib/LoraWan102
	symlink://../esp32_platformio/lib/DISPLAY
build_src_filter =
	+<*>
	+<../../esp32_platformio/src/SemtechRadio.cpp>
build_flags =
	-I../esp32_platformio/include
	-D REGION_US915
	-D ACTIVE_REGION=LORAMAC_REGION_US915
	-D LoRaWAN_DEBUG_LEVEL=0
	-D LORAWAN_PREAMBLE_LENGTH=8
	-D WIFI_LoRa_32_V3=true
	-D Wireless_Stick_V3=true
	-L../esp32_platformio/precompiled_libs
	-lheltec

; T3 handheld scanner board (Heltec Wireless Shell V3 module). It has no
; USB-to-serial chip, so the console is the ESP32-S3's own USB port.
[env:t3_scanner]
build_flags =
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1

; Same, with EncryptedLoRaLink between the link and RollCall.
[env:t3_scanner_encrypted]
build_flags =
	${env:t3_scanner.build_flags}
	-D BENCH_ENCRYPTED=1

; Heltec WiFi LoRa 32 V3 / Wireless Stick V3 development boards (console on
; the CP2102 USB-to-serial chip).
[env:heltec_v3]

[env:heltec_v3_encrypted]
build_flags =
	${env.build_flags}
	-D BENCH_ENCRYPTED=1
